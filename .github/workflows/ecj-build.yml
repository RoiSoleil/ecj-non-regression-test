name: ECJ builds of one shard

# One job per group of projects and label, as planned by scripts/plan.py. A matrix cannot generate more than 256 jobs,
# so ecj-matrix.yml calls this workflow for each shard of the plan.
on:
  workflow_call:
    inputs:
      jobs:
        description: "JSON array of jobs: {id, label, projects, jdk, parallel, cache_key, minutes}"
        type: string
        required: true
      baseline:
        description: "Baseline ECJ version from Maven Central"
        type: string
        required: true
      jfr:
        description: "'false' turns off the Java Flight Recording of the head builds"
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    # dashboard-data.py reads the projects of a job from its name
    name: "build (${{ matrix.id }} ${{ matrix.label }}: ${{ join(matrix.projects, ', ') }})"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "${{ matrix.jdk }}" }
      # The large builds need more than the free space of a runner. Deleting these tools took 90 seconds of every job,
      # more than the build of most projects: it now runs in the background, with a low CPU and I/O priority (not the idle
      # one: a build that keeps the disk busy must not stop it), and
      # the space is there long before a large build needs it.
      - name: Free disk space (in the background)
        run: sudo nohup ionice -c 2 -n 7 nice -n 10 rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - name: Use Maven 3.9.9
        # newer Maven versions break Tycho based projects (Eclipse Collections: "No implementation for MavenTargetLocationFactory")
        run: |
          # Maven Central rather than archive.apache.org, which resets connections under the load of a full matrix
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/maven.tar.gz" \
            https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$HOME"
          echo "$HOME/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      # Only the projects that ask for it (cache_m2 in projects.json, those whose dependencies are long to download;
      # plan.py gives them a job of their own): the caches of a repository are limited to 10 GB, far less than the
      # dependencies of every project. One cache for the three labels of a project. It must stay before the
      # installation of the head ECJ, which replaces the HEAD-SNAPSHOT that a saved cache may hold.
      - uses: actions/cache@v4
        if: matrix.cache_key != ''
        with:
          path: ~/.m2/repository
          key: ${{ matrix.cache_key }}
      # Only the head builds use the jar of this run. It is copied into the local repository with a minimal pom
      # (Maven resolves such a SNAPSHOT as one installed locally): mvn install:install-file took 3 seconds.
      - uses: actions/download-artifact@v5
        if: matrix.label == 'head'
        with: { name: ecj-HEAD.jar }
      - name: Install the head ECJ in the local Maven repository
        if: matrix.label == 'head'
        run: |
          D="$HOME/.m2/repository/org/eclipse/jdt/ecj/HEAD-SNAPSHOT"
          mkdir -p "$D"
          cp ecj-HEAD.jar "$D/ecj-HEAD-SNAPSHOT.jar"
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>org.eclipse.jdt</groupId><artifactId>ecj</artifactId><version>HEAD-SNAPSHOT</version></project>' > "$D/ecj-HEAD-SNAPSHOT.pom"
      # the baseline ECJ once for the job, before the builds that run two at a time
      - name: Download the baseline ECJ
        if: matrix.label == 'baseline'
        env:
          BASELINE: ${{ inputs.baseline }}
        # straight from Maven Central into the local repository: mvn dependency:get took 8 seconds
        run: |
          D="$HOME/.m2/repository/org/eclipse/jdt/ecj/$BASELINE"
          mkdir -p "$D"
          for f in jar pom; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$D/ecj-$BASELINE.$f" \
              "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/$BASELINE/ecj-$BASELINE.$f"
          done
      - name: "Build ${{ join(matrix.projects, ', ') }} (${{ matrix.label }})"
        env:
          BASELINE: ${{ inputs.baseline }}
          JFR: ${{ inputs.jfr }}
          LABEL: ${{ matrix.label }}
          PROJECTS: ${{ toJSON(matrix.projects) }}
          PARALLEL: ${{ matrix.parallel }}
        run: |
          VERSION="$BASELINE"
          [ "$LABEL" != javac ] || VERSION=javac   # untouched project, built with the JDK's javac
          [ "$LABEL" != head ] || VERSION=HEAD-SNAPSHOT
          export LABEL VERSION JFR
          # builds that share the runner (the baseline, two at a time) are no performance measure; Maven locks its
          # local repository between processes
          [ "$PARALLEL" = 1 ] || export SHARED_RUNNER=1
          build() {
            # the head ECJ is the one to profile (the baseline run is only the reference)
            if [ "$LABEL" = head ] && [ "$JFR" != false ]; then export JFR_FILE="$PWD/jfr/$1.jfr"; fi
            bash scripts/run-project.sh "$1" "$LABEL" "$VERSION" || echo "::warning::the build script of $1 failed"
          }
          export -f build
          jq -r '.[]' <<< "$PROJECTS" | xargs -P "$PARALLEL" -I{} bash -c 'build "$1"' _ {}
      - name: Marker of the artifact
        if: always()
        # tells scripts/download-results.sh that the artifact is downloaded
        run: mkdir -p markers && touch "markers/result-${{ matrix.id }}-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id }}-${{ matrix.label }}
          path: |
            results
            logs
            markers
      - uses: actions/upload-artifact@v4
        if: always() && matrix.label == 'head'
        with:
          name: jfr-${{ matrix.id }}
          path: jfr/*.jfr
          if-no-files-found: ignore
          retention-days: 14
