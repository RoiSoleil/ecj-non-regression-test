name: ECJ build of one label

# One job per project of a shard for one label (baseline, head or javac). A matrix cannot generate more than 256 jobs,
# so ecj-matrix.yml calls this workflow for each shard and label instead of having one matrix of projects x labels.
on:
  workflow_call:
    inputs:
      projects:
        description: "JSON array of project names"
        type: string
        required: true
      label:
        description: "baseline, head or javac"
        type: string
        required: true
      baseline:
        description: "Baseline ECJ version from Maven Central"
        type: string
        required: true
      jfr:
        description: "'false' turns off the Java Flight Recording of the head builds"
        type: string
        required: false
      jdk:
        description: "JDK of the builds (default 27), unless the project gives its own one (field jdk of projects.json)"
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.projects) }}
    name: build (${{ matrix.name }}, ${{ inputs.label }})
    steps:
      - uses: actions/checkout@v5
      - id: jdk
        env:
          PROJECT: ${{ matrix.name }}
          DEFAULT_JDK: ${{ inputs.jdk || '27' }}
        run: |
          echo "version=$(jq -r --arg name "$PROJECT" --arg jdk "$DEFAULT_JDK" '.[] | select(.name == $name) | .jdk // $jdk' projects.json)" >> "$GITHUB_OUTPUT"
          echo "cache_m2=$(jq -r --arg name "$PROJECT" '.[] | select(.name == $name) | .cache_m2 // false' projects.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r --arg name "$PROJECT" '.[] | select(.name == $name) | .ref' projects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "${{ steps.jdk.outputs.version }}" }
      # The large builds need more than the free space of a runner. Deleting these tools took 90 seconds of every job,
      # more than the build of most projects: it now runs in the background, with a low CPU and I/O priority (not the idle
      # one: a build that keeps the disk busy must not stop it), and
      # the space is there long before a large build needs it.
      - name: Free disk space (in the background)
        run: sudo nohup ionice -c 2 -n 7 nice -n 10 rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/download-artifact@v5
        with: { name: ecj-HEAD.jar }
      - name: Use Maven 3.9.9
        # newer Maven versions break Tycho based projects (Eclipse Collections: "No implementation for MavenTargetLocationFactory")
        run: |
          # Maven Central rather than archive.apache.org, which resets connections under the load of a full matrix
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/maven.tar.gz" \
            https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$HOME"
          echo "$HOME/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      # Only the projects that ask for it (cache_m2 in projects.json, those whose dependencies are long to download):
      # the caches of a repository are limited to 10 GB, far less than the dependencies of every project.
      # One cache for the three labels of a project. It must stay before the installation of the head ECJ, which
      # replaces the HEAD-SNAPSHOT that a saved cache may hold.
      - uses: actions/cache@v4
        if: steps.jdk.outputs.cache_m2 == 'true'
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.name }}-${{ steps.jdk.outputs.ref }}
      - name: Install the head ECJ in the local Maven repository
        run: |
          for i in 1 2 3; do
            mvn -B -q install:install-file -Dfile=ecj-HEAD.jar -DgroupId=org.eclipse.jdt -DartifactId=ecj -Dversion=HEAD-SNAPSHOT -Dpackaging=jar && exit 0
            sleep 15
          done
          exit 1
      - name: Build ${{ matrix.name }} (${{ inputs.label }})
        env:
          BASELINE: ${{ inputs.baseline }}
          JFR: ${{ inputs.jfr }}
          LABEL: ${{ inputs.label }}
          PROJECT: ${{ matrix.name }}
        run: |
          VERSION="$BASELINE"
          [ "$LABEL" != javac ] || VERSION=javac   # untouched project, built with the JDK's javac
          if [ "$LABEL" = head ]; then
            VERSION=HEAD-SNAPSHOT
            # the head ECJ is the one to profile (the baseline run is only the reference)
            [ "$JFR" = false ] || export JFR_FILE="$PWD/jfr/$PROJECT.jfr"
          fi
          bash scripts/run-project.sh "$PROJECT" "$LABEL" "$VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.name }}-${{ inputs.label }}
          path: |
            results
            logs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.label == 'head'
        with:
          name: jfr-${{ matrix.name }}
          path: jfr/*.jfr
          if-no-files-found: ignore
          retention-days: 14
