name: ECJ Commit Watcher

on:
  schedule:
    - cron: "0 3 * * *"   # every night, only when eclipse.jdt.core has a new commit
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git ls-remote https://github.com/eclipse-jdt/eclipse.jdt.core.git refs/heads/master | cut -f1)
          # the last tested commit is the one of the last successful run of the matrix workflow
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/ecj-matrix.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].display_title // ""' || true)
          echo "latest=$LATEST last_run_title=$LAST"
          if [[ "$LAST" == *"$LATEST"* ]]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/ecj-matrix.yml
