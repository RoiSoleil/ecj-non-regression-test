name: ECJ Commit Watcher

on:
  schedule:
    # GitHub starts the scheduled runs of this repository 6-7 h late ("0 3" ran at ~10:00 UTC,
    # "23 1" at ~08:00 UTC): schedule in the evening so that the run starts during the night in Europe
    - cron: "17 18 * * *"   # every day, only when eclipse.jdt.core has a new commit
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          LATEST=$(git ls-remote https://github.com/eclipse-jdt/eclipse.jdt.core.git refs/heads/master | cut -f1)
          [ -n "$LATEST" ] || { echo "cannot read the eclipse.jdt.core master commit"; exit 1; }
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"
          # a tag tested/<sha> marks a commit that was already tested
          if git ls-remote --exit-code --tags origin "refs/tags/tested/$LATEST" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: write   # the called workflow's compare job publishes the dashboard (gh-pages)
      actions: read     # and lists the jobs and artifacts of the run for its links
    uses: ./.github/workflows/ecj-matrix.yml
    with:
      ecj_ref: ${{ needs.check.outputs.sha }}

  record:
    needs: [check, run]
    if: needs.run.result == 'success'   # a failing run is retried every night until it is fixed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          git tag -f "tested/$SHA"
          git push -f origin "tested/$SHA"
