name: ECJ Non-regression Builds

on:
  workflow_dispatch:
    inputs:
      ecj_ref:
        description: "eclipse.jdt.core commit, branch or tag to test (default: master)"
        required: false
      baseline:
        description: "Baseline ECJ version from Maven Central (default: latest release)"
        required: false
      projects:
        description: "Comma separated project names (default: all non optional)"
        required: false
      jfr:
        description: "Record a Java Flight Recording of the build with the head ECJ (default: true)"
        required: false
        default: "true"
      jdk:
        description: "JDK of the builds, unless a project gives its own one (default: 27)"
        required: false
  workflow_call:
    inputs:
      ecj_ref:
        type: string
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.projects.outputs.shards }}
      shard_indexes: ${{ steps.projects.outputs.shard_indexes }}
      baseline: ${{ steps.baseline.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: baseline
        env:
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
        run: |
          V="$INPUT_BASELINE"
          [ -n "$V" ] || V=$(curl -fsS https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          [ -n "$V" ] || { echo "cannot determine the baseline ECJ version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - id: projects
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
        run: |
          SEL="$(echo "$INPUT_PROJECTS" | tr -d ' ')"
          if [ -n "$SEL" ]; then
            FILTER='[.[] | select(.name as $n | ($sel | split(",") | index($n)))]'
          else
            FILTER='.'
          fi
          # a matrix cannot generate more than 256 jobs: the projects are split in shards, each one a matrix of its own
          SHARDS="$(jq -c --arg sel "$SEL" "$FILTER | [.[].name] | . as \$names | [range(0; length; 100) | \$names[.:.+100]]" projects.json)"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shard_indexes=$(jq -c '[range(0; length)]' <<< "$SHARDS")" >> "$GITHUB_OUTPUT"

  build-ecj:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        # the annotation processing classes of ECJ need the JDK 25 API; the jar still targets Java 21
        with: { distribution: temurin, java-version: 25 }
      - id: build
        env:
          REF: ${{ github.event.inputs.ecj_ref || inputs.ecj_ref }}
        run: |
          git clone --filter=blob:none https://github.com/eclipse-jdt/eclipse.jdt.core.git ecj
          [ -z "$REF" ] || { git -C ecj fetch -q origin "$REF" && git -C ecj checkout -q FETCH_HEAD; }
          echo "sha=$(git -C ecj rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash scripts/build-ecj.sh ecj ecj-HEAD.jar
      - uses: actions/upload-artifact@v4
        with: { name: ecj-HEAD.jar, path: ecj-HEAD.jar }

  # baseline, head and javac run in parallel and do not share ~/.m2
  build:
    needs: [setup, build-ecj]
    strategy:
      fail-fast: false
      matrix:
        label: [baseline, head, javac]
        shard: ${{ fromJSON(needs.setup.outputs.shard_indexes) }}
    name: ${{ matrix.label }} ${{ matrix.shard }}
    uses: ./.github/workflows/ecj-build.yml
    with:
      projects: ${{ toJSON(fromJSON(needs.setup.outputs.shards)[matrix.shard]) }}
      label: ${{ matrix.label }}
      baseline: ${{ needs.setup.outputs.baseline }}
      jfr: ${{ github.event.inputs.jfr }}
      jdk: ${{ github.event.inputs.jdk }}

  compare:
    needs: [setup, build-ecj, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      # a full run has about 2,000 artifacts (results, logs, JFR): the listing stops at 1,000 by default, and the older
      # versions (v5) cannot raise it, so that the compare job only saw about half the results
      - uses: actions/download-artifact@v8.0.2
        env:
          ACTIONS_ARTIFACT_MAX_ARTIFACT_COUNT: 10000
        with:
          pattern: result-*
          path: artifacts
          merge-multiple: true
      - name: Compare
        env:
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
        run: |
          echo "Head ECJ: eclipse.jdt.core $ECJ_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare.py artifacts/results baseline head | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Performance, javac against ECJ
        if: always()
        run: python3 scripts/perf-compare.py artifacts/results javac head --html perf-report.html | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: perf-report.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-results
          path: artifacts
      - name: Status of every project
        if: always()
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
        run: |
          { echo; echo "### Status"; echo; bash scripts/status-table.sh artifacts/results projects.json "$INPUT_PROJECTS"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the dashboard
        # after the upload of all-results, so that the dashboard links to it; only the runs of main publish, so that a
        # branch under test does not replace the site
        if: always() && needs.build-ecj.result == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
          BASELINE: ${{ needs.setup.outputs.baseline }}
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
          INPUT_JDK: ${{ github.event.inputs.jdk }}
          INPUT_JFR: ${{ github.event.inputs.jfr }}
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
          REF_INPUT: ${{ github.event.inputs.ecj_ref }}   # of a run started by hand, not of a nightly one
        # the builds are done: a failing publish must not fail the run (the nightly check would test the commit again)
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, html_url}' > jobs.jsonl
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | {name, id}' > artifacts.jsonl
          date="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          bash scripts/publish-dashboard.sh python3 scripts/dashboard-data.py \
            --results artifacts/results --logs artifacts/logs --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --date "$date" --event "$GITHUB_EVENT_NAME" \
            --ecj-sha "$ECJ_SHA" --baseline "$BASELINE" --jdk "$INPUT_JDK" \
            --selection "$INPUT_PROJECTS" --jfr "$INPUT_JFR" --repo-sha "$GITHUB_SHA" \
            --baseline-input "$INPUT_BASELINE" --ref-input "$REF_INPUT" \
            --jobs jobs.jsonl --artifacts artifacts.jsonl
          echo "Dashboard: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/#/?run=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
