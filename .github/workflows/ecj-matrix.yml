name: ECJ Non-regression Builds

on:
  workflow_dispatch:
    inputs:
      ecj_ref:
        description: "eclipse.jdt.core commit, branch or tag to test (default: master)"
        required: false
      baseline:
        description: "Baseline ECJ version from Maven Central (default: latest release)"
        required: false
      projects:
        description: "Comma separated project names (default: all non optional)"
        required: false
  workflow_call:
    inputs:
      ecj_ref:
        type: string
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      baseline: ${{ steps.baseline.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: baseline
        env:
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
        run: |
          V="$INPUT_BASELINE"
          [ -n "$V" ] || V=$(curl -fsS https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          [ -n "$V" ] || { echo "cannot determine the baseline ECJ version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
        run: |
          SEL="$(echo "$INPUT_PROJECTS" | tr -d ' ')"
          if [ -n "$SEL" ]; then
            FILTER='[.[] | select(.name as $n | ($sel | split(",") | index($n)))]'
          else
            FILTER='[.[] | select(.optional != true)]'
          fi
          echo "matrix={\"include\":$(jq -c --arg sel "$SEL" "$FILTER" projects.json)}" >> "$GITHUB_OUTPUT"

  build-ecj:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - id: build
        env:
          REF: ${{ github.event.inputs.ecj_ref || inputs.ecj_ref }}
        run: |
          git clone --filter=blob:none https://github.com/eclipse-jdt/eclipse.jdt.core.git ecj
          [ -z "$REF" ] || { git -C ecj fetch -q origin "$REF" && git -C ecj checkout -q FETCH_HEAD; }
          echo "sha=$(git -C ecj rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash scripts/build-ecj.sh ecj ecj-HEAD.jar
      - uses: actions/upload-artifact@v4
        with: { name: ecj-HEAD.jar, path: ecj-HEAD.jar }

  build:
    needs: [setup, build-ecj]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v5
        with: { name: ecj-HEAD.jar }
      - name: Install the head ECJ in the local Maven repository
        run: mvn -B -q install:install-file -Dfile=ecj-HEAD.jar -DgroupId=org.eclipse.jdt -DartifactId=ecj -Dversion=HEAD-SNAPSHOT -Dpackaging=jar
      - name: Build with the baseline ECJ
        env:
          BASELINE: ${{ needs.setup.outputs.baseline }}
        run: bash scripts/run-project.sh "${{ matrix.name }}" baseline "$BASELINE"
      - name: Build with the head ECJ
        run: bash scripts/run-project.sh "${{ matrix.name }}" head HEAD-SNAPSHOT
      - name: Compare
        env:
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
        run: |
          echo "Head ECJ: eclipse.jdt.core $ECJ_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare.py results baseline head | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            results
            logs
