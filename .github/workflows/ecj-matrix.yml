name: ECJ Non-regression Builds

on:
  workflow_dispatch:
    inputs:
      ecj_ref:
        description: "eclipse.jdt.core commit, branch or tag to test (default: master)"
        required: false
      baseline:
        description: "Baseline ECJ version from Maven Central (default: latest release)"
        required: false
      projects:
        description: "Comma separated project names (default: all non optional)"
        required: false
      jfr:
        description: "Record a Java Flight Recording of the build with the head ECJ (default: true)"
        required: false
        default: "true"
      jdk:
        description: "JDK of the builds, unless a project gives its own one (default: 27)"
        required: false
  workflow_call:
    inputs:
      ecj_ref:
        type: string
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.projects.outputs.shards }}
      shard_indexes: ${{ steps.projects.outputs.shard_indexes }}
      baseline: ${{ steps.baseline.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: baseline
        env:
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
        run: |
          V="$INPUT_BASELINE"
          [ -n "$V" ] || V=$(curl -fsS https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          [ -n "$V" ] || { echo "cannot determine the baseline ECJ version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - id: projects
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
        run: |
          SEL="$(echo "$INPUT_PROJECTS" | tr -d ' ')"
          if [ -n "$SEL" ]; then
            FILTER='[.[] | select(.name as $n | ($sel | split(",") | index($n)))]'
          else
            FILTER='.'
          fi
          # a matrix cannot generate more than 256 jobs: the projects are split in shards, each one a matrix of its own
          SHARDS="$(jq -c --arg sel "$SEL" "$FILTER | [.[].name] | . as \$names | [range(0; length; 100) | \$names[.:.+100]]" projects.json)"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shard_indexes=$(jq -c '[range(0; length)]' <<< "$SHARDS")" >> "$GITHUB_OUTPUT"

  build-ecj:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        # the annotation processing classes of ECJ need the JDK 25 API; the jar still targets Java 21
        with: { distribution: temurin, java-version: 25 }
      - id: build
        env:
          REF: ${{ github.event.inputs.ecj_ref || inputs.ecj_ref }}
        run: |
          git clone --filter=blob:none https://github.com/eclipse-jdt/eclipse.jdt.core.git ecj
          [ -z "$REF" ] || { git -C ecj fetch -q origin "$REF" && git -C ecj checkout -q FETCH_HEAD; }
          echo "sha=$(git -C ecj rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash scripts/build-ecj.sh ecj ecj-HEAD.jar
      - uses: actions/upload-artifact@v4
        with: { name: ecj-HEAD.jar, path: ecj-HEAD.jar }

  # baseline, head and javac run in parallel and do not share ~/.m2
  build:
    needs: [setup, build-ecj]
    strategy:
      fail-fast: false
      matrix:
        label: [baseline, head, javac]
        shard: ${{ fromJSON(needs.setup.outputs.shard_indexes) }}
    name: ${{ matrix.label }} ${{ matrix.shard }}
    uses: ./.github/workflows/ecj-build.yml
    with:
      projects: ${{ toJSON(fromJSON(needs.setup.outputs.shards)[matrix.shard]) }}
      label: ${{ matrix.label }}
      baseline: ${{ needs.setup.outputs.baseline }}
      jfr: ${{ github.event.inputs.jfr }}
      jdk: ${{ github.event.inputs.jdk }}

  compare:
    needs: [build-ecj, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: result-*
          path: artifacts
          merge-multiple: true
      - name: Compare
        env:
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
        run: |
          echo "Head ECJ: eclipse.jdt.core $ECJ_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare.py artifacts/results baseline head | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Performance, javac against ECJ
        if: always()
        run: python3 scripts/perf-compare.py artifacts/results javac head --html perf-report.html | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: perf-report.html
          if-no-files-found: ignore
      - name: Status of every project
        id: status
        if: always()
        run: |
          python3 scripts/readme-status.py artifacts/results baseline head README.md > status.md
          { echo; echo "### Status"; echo; cat status.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the updated README
        # only a full default run on main: a partial run would mark the other projects "not run"
        if: >-
          always() && steps.status.outcome == 'success' && needs.build-ecj.result == 'success'
          && github.ref == 'refs/heads/main' && github.event.inputs.projects == ''
          && github.event.inputs.ecj_ref == '' && github.event.inputs.baseline == '' && github.event.inputs.jdk == ''
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: update the status table (ECJ ${ECJ_SHA::10})" README.md
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
        env:
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-results
          path: |
            artifacts
            README.md
