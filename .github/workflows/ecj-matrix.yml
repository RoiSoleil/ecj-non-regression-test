name: ECJ Non-regression Builds

on:
  workflow_dispatch:
    inputs:
      ecj_ref:
        description: "eclipse.jdt.core commit, branch or tag to test (default: master)"
        required: false
      baseline:
        description: "Baseline ECJ version from Maven Central (default: latest release)"
        required: false
      baseline_ref:
        description: "eclipse.jdt.core commit, branch or pull request ref to build the baseline ECJ from, instead of a release (for example the base of a pull request)"
        required: false
      bytecode:
        description: "Compare the class files of the baseline and head builds: report, or fail to also fail the run (for a change that must not change the generated code, with baseline_ref; default: off)"
        required: false
      projects:
        description: "Comma separated project names (default: all; to try new projects, add them to projects.json on a branch and run this workflow on it with labels=javac)"
        required: false
      jfr:
        description: "Record a Java Flight Recording of the build with the head ECJ (default: true)"
        required: false
        default: "true"
      jdk:
        description: "JDK feature release of the builds, unless a project gives its own one; jdks.json gives its exact update (default: 27)"
        required: false
      labels:
        description: "Comma separated labels to build: baseline, head, javac (default: all three; javac alone tries new projects)"
        required: false
      failed_from:
        description: "Id of an earlier run on the dashboard: build only its projects whose build failed or is missing with one of the labels (default: every project)"
        required: false
  workflow_call:
    inputs:
      ecj_ref:
        type: string
        required: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.projects.outputs.shards }}
      shard_indexes: ${{ steps.projects.outputs.shard_indexes }}
      baseline: ${{ steps.baseline.outputs.version }}
      jdk: ${{ steps.projects.outputs.jdk }}
      projects: ${{ steps.failed.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - id: baseline
        env:
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
          INPUT_BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
          INPUT_BYTECODE: ${{ github.event.inputs.bytecode }}
          INPUT_LABELS: ${{ github.event.inputs.labels }}
        run: |
          case "$INPUT_BYTECODE" in ''|report|fail) ;; *) echo "bytecode is report, fail or empty: $INPUT_BYTECODE"; exit 1 ;; esac
          # against a release, the class files differ for every change of ECJ since: only a report makes sense
          if [ "$INPUT_BYTECODE" = fail ] && [ -z "$INPUT_BASELINE_REF" ]; then echo "bytecode=fail needs baseline_ref"; exit 1; fi
          if [ -n "$INPUT_BASELINE" ] && [ -n "$INPUT_BASELINE_REF" ]; then echo "baseline and baseline_ref exclude each other"; exit 1; fi
          if [ -n "$INPUT_BASELINE_REF" ] && [ -n "$INPUT_LABELS" ] && [[ ",${INPUT_LABELS// /}," != *,baseline,* ]]; then
            echo "baseline_ref without the baseline label"; exit 1
          fi
          if [ -n "$INPUT_BYTECODE" ] && [ -n "$INPUT_LABELS" ] \
              && { [[ ",${INPUT_LABELS// /}," != *,baseline,* ]] || [[ ",${INPUT_LABELS// /}," != *,head,* ]]; }; then
            echo "bytecode compares the baseline and head builds: both labels are needed"; exit 1
          fi
          V="$INPUT_BASELINE"
          # a baseline built from a ref by the build-ecj job, installed under this version by the build jobs
          [ -z "$INPUT_BASELINE_REF" ] || V=BASE-SNAPSHOT
          [ -n "$V" ] || V=$(curl -fsS https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          [ -n "$V" ] || { echo "cannot determine the baseline ECJ version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # The durations of the last full run, to group the short projects and start the longest jobs first
      # (scripts/plan.py). Without them (first run, site down) every project counts as a short build.
      - name: Durations of the last full run
        run: |
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          RUN="$(curl -fsS --retry 3 "$SITE/data/runs.json" | jq -r '[(if type == "array" then . else .runs end)[] | select(.partial | not)][0].id // empty')" || true
          [ -z "$RUN" ] || curl -fsS --retry 3 -o durations.json "$SITE/data/runs/$RUN/summary.json" || true
      # The projects input, or, with failed_from, the projects of that run whose build failed or is missing with one of
      # the labels to build (among the projects input, if given). A project that a later commit renamed or removed is
      # left out by plan.py.
      - id: failed
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
          INPUT_FAILED_FROM: ${{ github.event.inputs.failed_from }}
          INPUT_LABELS: ${{ github.event.inputs.labels || 'baseline,head,javac' }}
        run: |
          if [ -z "$INPUT_FAILED_FROM" ]; then echo "projects=$INPUT_PROJECTS" >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$INPUT_FAILED_FROM" =~ ^[0-9]+$ ]] || { echo "failed_from is no run id: $INPUT_FAILED_FROM"; exit 1; }
          SITE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --retry 3 -o failed-from.json "$SITE/data/runs/$INPUT_FAILED_FROM/summary.json" \
            || { echo "run $INPUT_FAILED_FROM is not on the dashboard"; exit 1; }
          FAILED="$(jq -r --arg labels "$INPUT_LABELS" --arg only "$INPUT_PROJECTS" '
            ($labels | gsub(" "; "") | split(",") | map(select(. != ""))) as $labels
            | ($only | gsub(" "; "") | split(",") | map(select(. != ""))) as $only
            | [.projects[] | select(($only | length) == 0 or (.name as $n | $only | index($n)))
               | select(.labels as $l | any($labels[]; $l[.].status != "success")) | .name] | join(",")' failed-from.json)"
          [ -n "$FAILED" ] || { echo "no failed build in run $INPUT_FAILED_FROM"; exit 1; }
          echo "$(tr ',' '\n' <<< "$FAILED" | wc -l) failed project(s) of run $INPUT_FAILED_FROM" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "projects=$FAILED" >> "$GITHUB_OUTPUT"
      - id: projects
        env:
          INPUT_PROJECTS: ${{ steps.failed.outputs.projects }}
          IGNORE_UNKNOWN: ${{ github.event.inputs.failed_from && '--ignore-unknown' || '' }}
          INPUT_JDK: ${{ github.event.inputs.jdk || '27' }}
          INPUT_LABELS: ${{ github.event.inputs.labels || 'baseline,head,javac' }}
        run: |
          SHARDS="$(python3 scripts/plan.py --jdk "$INPUT_JDK" --projects "$INPUT_PROJECTS" $IGNORE_UNKNOWN --labels "$INPUT_LABELS" --durations durations.json 2> plan.txt)" || { cat plan.txt; exit 1; }
          cat plan.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "jdk=$INPUT_JDK" >> "$GITHUB_OUTPUT"   # the same default JDK for the second builds of the suspects
          echo "$SHARDS" > plan.json
          echo "shard_indexes=$(jq -c '[range(0; length)]' <<< "$SHARDS")" >> "$GITHUB_OUTPUT"
      # the projects of every job, for the links of the dashboard
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: plan.json }

  build-ecj:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      base_sha: ${{ steps.build.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: jdk
        run: echo "version=$(jq -r '."25"' jdks.json)" >> "$GITHUB_OUTPUT"
      # the annotation processing classes of ECJ need the JDK 25 API; the jar still targets Java 21
      - uses: ./.github/actions/setup-jdk
        with: { version: "${{ steps.jdk.outputs.version }}" }
      - id: build
        env:
          REF: ${{ github.event.inputs.ecj_ref || inputs.ecj_ref }}
          BASE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          # GitHub answers a clone with an error now and then: a failing clone fails the whole run, try 3 times
          # (not the fetch of the ref: a ref that does not exist fails at once)
          for attempt in 1 2 3; do
            rm -rf ecj
            git clone -q --filter=blob:none https://github.com/eclipse-jdt/eclipse.jdt.core.git ecj && break
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          [ -z "$REF" ] || { git -C ecj fetch -q origin "$REF" && git -C ecj checkout -q FETCH_HEAD; }
          echo "sha=$(git -C ecj rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash scripts/build-ecj.sh ecj ecj-HEAD.jar
          if [ -n "$BASE_REF" ]; then
            git -C ecj fetch -q origin "$BASE_REF" || { echo "cannot fetch baseline_ref $BASE_REF"; exit 1; }
            git -C ecj checkout -q FETCH_HEAD
            echo "base_sha=$(git -C ecj rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            bash scripts/build-ecj.sh ecj ecj-BASE.jar
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ecj-HEAD.jar, path: ecj-HEAD.jar }
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.baseline_ref != ''
        with: { name: ecj-BASE.jar, path: ecj-BASE.jar }

  # the jobs planned by scripts/plan.py: a group of projects and a label each, the longest jobs in the first shard
  build:
    needs: [setup, build-ecj]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shard_indexes) }}
    name: shard ${{ matrix.shard }}
    uses: ./.github/workflows/ecj-build.yml
    with:
      jobs: ${{ toJSON(fromJSON(needs.setup.outputs.shards)[matrix.shard]) }}
      baseline: ${{ needs.setup.outputs.baseline }}
      baseline_jar: ${{ github.event.inputs.baseline_ref != '' }}
      bytecode: ${{ github.event.inputs.bytecode }}
      jfr: ${{ github.event.inputs.jfr }}

  # The projects that look like regressions are built a second time, alone in their job, with both compilers: a failure
  # of the shared runner (a lost runner, a download that fails, a slow disk) must not fail the run. More than 100
  # suspects is no accident of a runner: they are not built again.
  suspects:
    needs: [setup, build-ecj, build]
    # not for a run without baseline or head builds (the trial of new projects with javac)
    if: >-
      always() && needs.build-ecj.result == 'success' && needs.build.result != 'skipped'
      && (!github.event.inputs.labels || (contains(github.event.inputs.labels, 'baseline') && contains(github.event.inputs.labels, 'head')))
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      # the projects whose class files differ that are built a second time (bytecode input)
      bytecode_suspects: ${{ steps.plan.outputs.bytecode_suspects }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: result-*
          path: artifacts
          merge-multiple: true
      - name: Download the results the action did not see
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-results.sh artifacts
      - id: plan
        shell: bash   # with pipefail: a failure of plan.py must not give an empty list of jobs
        env:
          INPUT_JDK: ${{ needs.setup.outputs.jdk }}
          INPUT_BYTECODE: ${{ github.event.inputs.bytecode }}
          INPUT_BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          python3 scripts/compare.py artifacts/results baseline head --suspects > suspects.txt
          COUNT=$(wc -l < suspects.txt)
          echo "$COUNT suspect project(s): $(paste -sd, suspects.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -le 100 ] || : > suspects.txt
          # the projects whose class files differ are built again too: a class file that differs between the two builds
          # of one compiler says nothing of the compiler (scripts/bytecode.py); the second builds keep the class files
          # listed in bytecode-lists for the javap diff. Not against a release: every project differs then
          # at most 128 projects in all: 256 jobs, a shard of plan.py
          MAX=$(( 128 - $(wc -l < suspects.txt) )); [ "$MAX" -le 30 ] || MAX=30
          if [ -n "$INPUT_BYTECODE" ] && [ -n "$INPUT_BASELINE_REF" ] && [ "$MAX" -gt 0 ]; then
            # a failure here must not take the second builds from the suspect regressions
            python3 scripts/bytecode.py suspects artifacts/results baseline head bytecode-lists --max "$MAX" > bytecode-suspects.txt \
              || { echo "::warning::bytecode.py suspects failed"; : > bytecode-suspects.txt; }
            echo "$(wc -l < bytecode-suspects.txt) project(s) with different class files: $(paste -sd, bytecode-suspects.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "bytecode_suspects=$(paste -sd, bytecode-suspects.txt)" >> "$GITHUB_OUTPUT"
            sort -u suspects.txt bytecode-suspects.txt -o suspects.txt
          fi
          if [ ! -s suspects.txt ]; then echo "jobs=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          JOBS="$(python3 scripts/plan.py --jdk "$INPUT_JDK" --projects "$(paste -sd, suspects.txt)" --labels baseline,head \
            --alone --ignore-unknown --id-prefix c --durations /dev/null | jq -c '.[0] // []')"
          # the class files that the second builds keep for the javap diff, in the matrix of the confirm jobs (an
          # artifact would cost them REST requests, which download-results.sh needs)
          if [ -d bytecode-lists ]; then
            KEPT="$(python3 scripts/bytecode.py keep bytecode-lists <<< "$JOBS")" && JOBS="$KEPT" \
              || echo "::warning::bytecode.py keep failed: no javap diff"
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
      # the compare job takes these results instead of downloading every artifact again: the token of a workflow has
      # 1,000 REST requests an hour, and download-results.sh may already have used most of them
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-results
          path: artifacts

  confirm:
    needs: [setup, suspects]
    if: always() && needs.suspects.result == 'success' && needs.suspects.outputs.jobs != '[]'
    uses: ./.github/workflows/ecj-build.yml
    with:
      jobs: ${{ needs.suspects.outputs.jobs }}
      baseline: ${{ needs.setup.outputs.baseline }}
      baseline_jar: ${{ github.event.inputs.baseline_ref != '' }}
      bytecode: ${{ github.event.inputs.bytecode }}
      jfr: "false"
      prefix: confirm

  compare:
    needs: [setup, build-ecj, build, suspects, confirm]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      # The results that the suspects job downloaded (one artifact, found by name through the REST API), or, without
      # it, every result artifact. download-artifact only sees the first 1,000 artifacts of a run: download-results.sh
      # downloads the others through the REST API, which lists them all but allows 1,000 requests an hour.
      - name: Download the results of the suspects job
        id: first
        if: needs.suspects.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=first-results" --jq '.artifacts[0].id')"
          [ -n "$ID" ] && [ "$ID" != null ]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > first-results.zip
          mkdir -p artifacts && unzip -q -o first-results.zip -d artifacts && rm first-results.zip
      - uses: actions/download-artifact@v8.0.2
        if: needs.suspects.result != 'success' || steps.first.outcome != 'success'
        with:
          pattern: result-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with: { name: plan }
      - name: Download the results the action did not see
        if: needs.suspects.result != 'success' || steps.first.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-results.sh artifacts
      - uses: actions/download-artifact@v8.0.2
        if: needs.confirm.result != 'skipped'
        continue-on-error: true   # the script below downloads what this action did not
        with:
          pattern: confirm-*
          path: confirm
          merge-multiple: true
      - name: Download the second builds the action did not see
        if: needs.confirm.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-results.sh confirm confirm
      - name: Compare
        env:
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
          BASE_SHA: ${{ needs.build-ecj.outputs.base_sha }}
        run: |
          echo "Head ECJ: eclipse.jdt.core $ECJ_SHA" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$BASE_SHA" ] || echo "Baseline ECJ: eclipse.jdt.core $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          CONFIRM=(); [ -d confirm/results ] && CONFIRM=(--confirm confirm)
          python3 scripts/compare.py artifacts/results baseline head "${CONFIRM[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      # javap, for the diffs of the class files
      - id: jdk
        if: always() && github.event.inputs.bytecode != '' && needs.setup.outputs.jdk != ''
        env:
          INPUT_JDK: ${{ needs.setup.outputs.jdk }}
        run: echo "version=$(jq -r --arg f "$INPUT_JDK" '.[$f]' jdks.json)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-jdk
        if: always() && steps.jdk.outputs.version != '' && steps.jdk.outputs.version != 'null'
        continue-on-error: true   # bytecode.py leaves the javap diffs out without it
        with: { version: "${{ steps.jdk.outputs.version }}" }
      - name: Class files
        if: always() && github.event.inputs.bytecode != ''
        env:
          INPUT_BYTECODE: ${{ github.event.inputs.bytecode }}
          INPUT_BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
          BYTECODE_SUSPECTS: ${{ needs.suspects.outputs.bytecode_suspects }}
        run: |
          ARGS=(); [ "$INPUT_BYTECODE" = fail ] && ARGS=(--fail)
          # the projects whose class files differ are built a second time against a baseline built from a ref only
          [ -z "$INPUT_BASELINE_REF" ] || ARGS+=(--second-builds --planned "$BYTECODE_SUSPECTS")
          [ -d confirm/results ] && ARGS+=(--confirm confirm)
          python3 scripts/bytecode.py report artifacts/results baseline head "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Performance, javac against ECJ
        if: always()
        run: python3 scripts/perf-compare.py artifacts/results javac head --html perf-report.html | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: perf-report.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-results
          path: artifacts
      - name: Status of every project
        if: always()
        env:
          INPUT_PROJECTS: ${{ needs.setup.outputs.projects }}
        run: |
          { echo; echo "### Status"; echo; bash scripts/status-table.sh artifacts/results projects.json "$INPUT_PROJECTS"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the dashboard
        # after the upload of all-results, so that the dashboard links to it; only the runs of main publish, so that a
        # branch under test does not replace the site
        # nor a run of some labels only (the trial of new projects with javac): it is no comparison of ECJ
        # nor a run against a baseline built from a ref: the dashboard compares with releases
        if: always() && needs.build-ecj.result == 'success' && github.ref == 'refs/heads/main' && !github.event.inputs.labels && !github.event.inputs.baseline_ref
        env:
          GH_TOKEN: ${{ github.token }}
          ECJ_SHA: ${{ needs.build-ecj.outputs.sha }}
          BASELINE: ${{ needs.setup.outputs.baseline }}
          INPUT_PROJECTS: ${{ needs.setup.outputs.projects }}
          INPUT_JDK: ${{ github.event.inputs.jdk }}
          INPUT_JFR: ${{ github.event.inputs.jfr }}
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
          REF_INPUT: ${{ github.event.inputs.ecj_ref }}   # of a run started by hand, not of a nightly one
        # the builds are done: a failing publish must not fail the run (the nightly check would test the commit again)
        continue-on-error: true
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, html_url}' > jobs.jsonl
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | {name, id}' > artifacts.jsonl
          date="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          bash scripts/publish-dashboard.sh python3 scripts/dashboard-data.py \
            --results artifacts/results --logs artifacts/logs --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --date "$date" --event "$GITHUB_EVENT_NAME" \
            --ecj-sha "$ECJ_SHA" --baseline "$BASELINE" --jdk "$INPUT_JDK" \
            --selection "$INPUT_PROJECTS" --jfr "$INPUT_JFR" --repo-sha "$GITHUB_SHA" \
            --baseline-input "$INPUT_BASELINE" --ref-input "$REF_INPUT" \
            --jobs jobs.jsonl --artifacts artifacts.jsonl --plan plan.json
          echo "Dashboard: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/#/?run=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
